name: kanjiapp
description: KanjiKi - A spaced repetition Japanese app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.5.3
  signature: ^5.4.0
  path_drawing: ^1.0.1
  file_picker: ^10.3.10
  share_plus: ^12.0.2
  sqflite_common_ffi_web: ^1.0.1+1
  intl: ^0.20.2
  supabase_flutter: ^2.12.2
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  xml: ^6.5.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icons/
    - .env
